<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 440" width="100%" height="100%">
  <defs>
    <!-- 1. Upper Ribbon Gradient: sweeps from violet on left through royal blue, cyan, to turquoise jaw -->
    <linearGradient id="cf-upper-ribbon" x1="0.10" y1="0.65" x2="0.85" y2="0.30">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="18%" stop-color="#3b82f6"/>
      <stop offset="48%" stop-color="#1691fa"/>
      <stop offset="72%" stop-color="#10b1f8"/>
      <stop offset="88%" stop-color="#49e4ff"/>
      <stop offset="100%" stop-color="#53e0f2"/>
    </linearGradient>

    <!-- 2. Upper Right Lobe Glossy Highlight -->
    <linearGradient id="cf-lobe-gleam" x1="0.65" y1="0.18" x2="0.92" y2="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- 3. Lower Ribbon Gradient: sweeps from violet on left through cobalt cradle to electric indigo on bottom right -->
    <linearGradient id="cf-lower-ribbon" x1="0.12" y1="0.45" x2="0.88" y2="0.88">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="18%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#0d56fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="88%" stop-color="#3735fd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 4. Lower Cradle Crest Specular Rim -->
    <linearGradient id="cf-cradle-gleam" x1="0.15" y1="0.60" x2="0.75" y2="0.85">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.60"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- 5. Top Cyan Sphere (3D Radial Gradient) -->
    <radialGradient id="cf-sphere-top" cx="36%" cy="30%" r="65%" fx="30%" fy="24%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cffafe"/>
      <stop offset="48%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- 6. Left Magenta Sphere (3D Radial Gradient) -->
    <radialGradient id="cf-sphere-left" cx="36%" cy="30%" r="65%" fx="30%" fy="24%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#fdf2f8"/>
      <stop offset="42%" stop-color="#e879f9"/>
      <stop offset="75%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>

    <!-- 7. Bottom Indigo Sphere (3D Radial Gradient) -->
    <radialGradient id="cf-sphere-bot" cx="36%" cy="30%" r="65%" fx="30%" fy="24%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#e0e7ff"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="78%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>

    <!-- 8. Three Center Dots Gradient -->
    <linearGradient id="cf-dot-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0837cc"/>
    </linearGradient>

    <!-- 9. Wordmark '-agent' Blue-Violet Linear Gradient -->
    <linearGradient id="cf-text-agent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2888ec"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- 10. Ambient Shadow Filter for Spheres -->
    <radialGradient id="cf-ambient-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050814" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#050814" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="chatflow-symbol" transform="translate(20, 20)">
