    <!-- Upper Right Lobe Glossy Highlight -->
    <path d="M 280,72 C 320,68 350,92 365,120 C 382,145 388,180 376,210 C 362,230 338,235 328,227 C 342,205 348,175 336,145 C 324,115 304,88 280,72 Z"
          fill="url(#cf-lobe-gleam)"/>

