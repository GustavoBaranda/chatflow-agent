    <path d="M 41.00,207.00 C 58.33,204.67 83.00,204.33 104.00,203.00 C 104.33,214.67 103.67,229.00 105.00,238.00 C 106.33,247.00 109.50,252.00 112.00,257.00 C 114.50,262.00 116.17,263.83 120.00,268.00 C 123.83,272.17 128.83,277.50 135.00,282.00 C 141.17,286.50 148.17,291.67 157.00,295.00 C 165.83,298.33 171.17,300.50 188.00,302.00 C 204.83,303.50 243.17,302.33 258.00,304.00 C 272.83,305.67 271.83,309.17 277.00,312.00 C 282.17,314.83 285.00,318.00 289.00,321.00 C 291.00,307.33 292.67,289.50 295.00,280.00 C 297.33,270.50 300.33,268.17 303.00,264.00 C 305.67,259.83 307.17,258.33 311.00,255.00 C 314.83,251.67 321.33,246.67 326.00,244.00 C 330.67,241.33 334.50,239.83 339.00,239.00 C 343.50,238.17 348.33,238.17 353.00,239.00 C 357.67,239.83 362.50,241.83 367.00,244.00 C 371.50,246.17 375.83,248.67 380.00,252.00 C 384.17,255.33 388.67,259.33 392.00,264.00 C 395.33,268.67 398.00,274.67 400.00,280.00 C 402.00,285.33 403.33,288.83 404.00,296.00 C 404.67,303.17 404.67,316.00 404.00,323.00 C 403.33,330.00 403.50,331.17 400.00,338.00 C 396.50,344.83 388.17,357.83 383.00,364.00 C 377.83,370.17 374.33,371.83 369.00,375.00 C 363.67,378.17 357.83,381.50 351.00,383.00 C 344.17,384.50 339.17,387.67 328.00,384.00 C 316.83,380.33 295.67,366.17 284.00,361.00 C 272.33,355.83 267.00,354.33 258.00,353.00 C 249.00,351.67 245.83,351.50 230.00,353.00 C 214.17,354.50 179.50,360.83 163.00,362.00 C 146.50,363.17 138.83,361.17 131.00,360.00 C 123.17,358.83 122.00,357.67 116.00,355.00 C 110.00,352.33 101.83,348.67 95.00,344.00 C 88.17,339.33 81.67,334.83 75.00,327.00 C 68.33,319.17 59.67,305.67 55.00,297.00 C 50.33,288.33 49.00,283.00 47.00,275.00 C 45.00,267.00 45.67,253.67 43.00,249.00 C 40.33,244.33 35.33,248.50 31.00,247.00 C 26.67,245.50 20.83,242.50 17.00,240.00 C 13.17,237.50 10.83,235.83 8.00,232.00 C 5.17,228.17 2.67,222.00 0.00,217.00 C 13.67,213.67 23.67,209.33 41.00,207.00 Z" fill="url(#cf-lower-ribbon)"/>

    <!-- Lower Cradle Specular Rim -->
    <path d="M 120,360 C 180,385 250,380 310,360 C 270,365 200,368 135,350 Z"
          fill="url(#cf-cradle-gleam)"/>

    <!-- 3. Three Ellipsis Dots inside Chat Cavity -->
    <circle cx="171.4" cy="225.0" r="16.7" fill="url(#cf-dot-grad)"/>
    <circle cx="215.3" cy="225.0" r="16.7" fill="url(#cf-dot-grad)"/>
    <circle cx="259.2" cy="225.0" r="16.7" fill="url(#cf-dot-grad)"/>

    <!-- Ambient Occlusion under Top & Bottom Spheres -->
    <ellipse cx="312" cy="56" rx="36" ry="34" fill="url(#cf-ambient-shadow)"/>
    <ellipse cx="344" cy="348" rx="46" ry="44" fill="url(#cf-ambient-shadow)"/>

    <!-- 4. The Three Exterior Nodes (Spheres) -->
    <circle cx="309" cy="49" r="35" fill="url(#cf-sphere-top)"/>
    <circle cx="41" cy="207" r="39" fill="url(#cf-sphere-left)"/>
    <circle cx="340" cy="340" r="45" fill="url(#cf-sphere-bot)"/>
  </g>
  <g id="chatflow-wordmark">
    <text x="495" y="222" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="120" font-weight="700" letter-spacing="-0.025em">
      <tspan fill="#ffffff">chatflow</tspan><tspan fill="url(#cf-text-agent-grad)">-agent</tspan>
    </text>
    <text x="502" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.32em" fill="#64748b">
      BUILD · ORCHESTRATE · CONNECT
    </text>
  </g>
</svg>